[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratelimit-forensics"
version = "0.1.0"
description = "Attribute captured HTTP 429 responses to the enforcing layer, offline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ratelimit-forensics contributors" }]
keywords = ["http", "429", "rate-limit", "forensics", "cloudflare", "openai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: System :: Networking",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.scripts]
ratelimit-forensics = "ratelimit_forensics.cli:main"

[project.urls]
Homepage = "https://github.com/maxico714/ratelimit-forensics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ratelimit_forensics = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
